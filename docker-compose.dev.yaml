# ==============================================================================
# Mana Paes — docker-compose de DESENVOLVIMENTO LOCAL (tudo mockado)
# ------------------------------------------------------------------------------
# Infraestrutura + API em modo JVM (sem GraalVM Native Image).
#
# Tudo que depende de provedores externos está MOCKADO:
#   - Evolution API (WhatsApp) -> MOCK no backend (EVOLUTION_API_URL vazio)
#   - SMTP (e-mail)            -> Mailpit (captura local, UI em http://localhost:8025)
#   - RabbitMQ                 -> contêiner local (fila real, porém isolada)
#
# TODAS as variáveis são lidas do arquivo `.env` na RAIZ do repositório —
# SEM fallback: se a variável não estiver definida no .env, o compose falha
# na interpolação.
#
# Uso:
#   cp example.env .env   # e preencha TODOS os valores
#   docker compose -f docker-compose.dev.yaml up -d --build
#   docker compose -f docker-compose.dev.yaml logs -f api
#
# Serviços:
#   postgres  -> banco de dados (porta 5432)
#   rabbitmq  -> fila de notificações + management UI (porta 15672)
#   mailpit   -> captura de e-mails em dev (UI na porta 8025, SMTP na 1025)
#   api       -> backend Spring Boot em JVM (porta 8080)
#   web       -> frontend React (porta 3000)
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: mana-paes-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Sem ports: no Coolify a exposição é via domínio (proxy). Para dev local
    # com portas no host, usar docker-compose.dev.local.yaml (override).
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: mana-paes-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: mana-paes-mailpit
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./mana-paes-api
      dockerfile: local.Dockerfile
    container_name: mana-paes-api
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_ENABLED: ${MAIL_ENABLED}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED}
      JWT_SECRET: ${JWT_SECRET}
      APP_ENCRYPTION_MASTER_KEY: ${APP_ENCRYPTION_MASTER_KEY}
      # Evolution API vazia => MOCK do WhatsApp ativo (sem chamadas externas)
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      APP_BACKEND_URL: ${APP_BACKEND_URL}
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  web:
    build:
      context: ./mana-paes-web
      dockerfile: Dockerfile
      args:
        # Em dev o Vite tem proxy para /api -> localhost:8080, mas no build de
        # produção (react-router-serve) o proxy não existe: aponte para a API.
        VITE_API_URL: ${VITE_API_URL}
    container_name: mana-paes-web
    depends_on:
      - api

volumes:
  pgdata:
  rabbitmqdata: