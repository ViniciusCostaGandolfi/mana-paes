spring:
  config:
    activate:
      on-profile: test

  # Perfil de teste: H2 em memoria, sem console web, mesma validacao de schema.
  datasource:
    url: jdbc:h2:mem:manapaes-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: false

  flyway:
    enabled: true
    locations: classpath:db/migration