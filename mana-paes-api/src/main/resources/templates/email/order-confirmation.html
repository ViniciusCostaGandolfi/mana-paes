<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pedido confirmado — Mana Paes</title>
</head>
<body style="font-family: Arial, Helvetica, sans-serif; line-height: 1.6; color: #333333; margin: 0; padding: 0; background-color: #faf7f2;">
    <div style="max-width: 560px; margin: 32px auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; border: 1px solid #e7e0d6;">
        <div style="background-color: #b45309; color: #ffffff; padding: 24px 32px;">
            <h1 style="margin: 0; font-size: 24px;">Mana Paes</h1>
        </div>
        <div style="padding: 32px;">
            <h2 style="margin-top: 0; color: #b45309;">Olá, <span th:text="${requesterName}">Nome</span>!</h2>
            <p>Seu pedido foi confirmado:</p>
            <p><strong>Pedido:</strong> #<span th:text="${orderId}">12345678</span></p>
            <p><strong>Entrega:</strong> <span th:text="${#temporals.format(deliveryDate, 'dd/MM/yyyy')}">01/09/2026</span></p>

            <h3 style="color: #b45309;">Itens do pedido</h3>
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="background-color: #faf7f2;">
                        <th style="text-align: left; padding: 8px;">Produto</th>
                        <th style="text-align: right; padding: 8px;">Quantidade</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${items}" style="border-bottom: 1px solid #e7e0d6;">
                        <td style="padding: 8px;" th:text="${item.productName}">Produto</td>
                        <td style="padding: 8px; text-align: right;"
                            th:text="${item.quantity} + ' ' + ${item.unitMeasure}">1 UN</td>
                    </tr>
                </tbody>
            </table>

            <p style="font-size: 18px; font-weight: bold; color: #b45309; margin-top: 24px;">
                Total: <span th:text="${totalAmount}">R$ 0,00</span>
            </p>
            <p>Obrigado pela preferência!</p>
        </div>
        <div style="background-color: #faf7f2; padding: 16px 32px; font-size: 12px; color: #8a8178;">
            <p style="margin: 0;">© Mana Paes — Gestão de pedidos para padarias.</p>
        </div>
    </div>
</body>
</html>
