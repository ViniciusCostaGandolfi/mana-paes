<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#C96A0D"/>
    </linearGradient>
    <radialGradient id="crust" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#B4602E"/>
      <stop offset="0.65" stop-color="#8A3E1C"/>
      <stop offset="1" stop-color="#5F260E"/>
    </radialGradient>
  </defs>

  <!-- warm amber background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- subtle inner rim for depth -->
  <circle cx="256" cy="256" r="206" fill="none" stroke="#FFE3A3" stroke-opacity="0.35" stroke-width="6"/>

  <!-- bread bun (round loaf) -->
  <circle cx="256" cy="258" r="152" fill="url(#crust)"/>
  <circle cx="256" cy="258" r="152" fill="none" stroke="#431C08" stroke-opacity="0.4" stroke-width="12"/>

  <!-- soft top-light highlight -->
  <ellipse cx="228" cy="196" rx="74" ry="46" fill="#F3B37C" fill-opacity="0.55"/>

  <!-- scoring cuts on the crust -->
  <path d="M 252 148 C 294 178 312 220 300 262" stroke="#FDE9C8" stroke-width="18" stroke-linecap="round" fill="none"/>
  <path d="M 198 172 C 182 208 188 248 216 274" stroke="#FDE9C8" stroke-width="17" stroke-linecap="round" fill="none"/>
  <path d="M 314 178 C 334 208 338 250 322 292" stroke="#FDE9C8" stroke-width="15" stroke-linecap="round" fill="none"/>

  <!-- flour dust -->
  <circle cx="172" cy="304" r="8" fill="#FFF6E3" fill-opacity="0.9"/>
  <circle cx="348" cy="292" r="6" fill="#FFF6E3" fill-opacity="0.9"/>
  <circle cx="304" cy="356" r="7" fill="#FFF6E3" fill-opacity="0.9"/>
  <circle cx="206" cy="356" r="5" fill="#FFF6E3" fill-opacity="0.9"/>
  <circle cx="262" cy="368" r="5" fill="#FFF6E3" fill-opacity="0.75"/>
</svg>