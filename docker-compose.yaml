services:
  postgres:
    image: postgres:16-alpine
    container_name: mana-paes-postgres
    environment:
      POSTGRES_DB: manapaes
      POSTGRES_USER: manapaes
      POSTGRES_PASSWORD: manapaes
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manapaes -d manapaes"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: mana-paes-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: manapaes
      RABBITMQ_DEFAULT_PASS: manapaes
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  api:
    build:
      context: ./mana-paes-api
      dockerfile: local.Dockerfile
    container_name: mana-paes-api
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: manapaes
      DB_USER: manapaes
      DB_PASSWORD: manapaes
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      RABBIT_USER: manapaes
      RABBIT_PASSWORD: manapaes
      SMTP_HOST: '${SMTP_HOST:-}'
      SMTP_PORT: '${SMTP_PORT:-587}'
      SMTP_USER: '${SMTP_USER:-}'
      SMTP_PASSWORD: '${SMTP_PASSWORD:-}'
      MAIL_ENABLED: '${MAIL_ENABLED:-false}'
      NOTIFICATIONS_ENABLED: "true"
      SCHEDULER_ENABLED: "true"
      JWT_SECRET: '${JWT_SECRET:-}'
      APP_ENCRYPTION_MASTER_KEY: '${APP_ENCRYPTION_MASTER_KEY:-}'
      EVOLUTION_API_URL: '${EVOLUTION_API_URL:-}'
      EVOLUTION_API_KEY: '${EVOLUTION_API_KEY:-}'
      APP_BACKEND_URL: '${APP_BACKEND_URL:-}'
      FRONTEND_URL: '${FRONTEND_URL:-}'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  web:
    build:
      context: ./mana-paes-web
      dockerfile: Dockerfile
    container_name: mana-paes-web
    depends_on:
      - api

volumes:
  pgdata:
  rabbitmqdata: