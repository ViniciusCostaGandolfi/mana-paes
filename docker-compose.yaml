# Stack SIMPLIFICADA — Mana Paes (Evolution API e SMTP externos via env vars)
#
# Este compose NÃO inclui serviços mockados (Mailpit / Evolution local).
# A Evolution API e o SMTP são referenciados APENAS por variáveis de ambiente.
# A API roda em modo JVM (local.Dockerfile); o build nativo é para a nuvem
# (Dockerfile.cloud / CI).
#
# Uso:
#   docker compose up -d --build
#
# Configure um arquivo .env na raiz (ou exporte as variáveis) com, no mínimo:
#   EVOLUTION_API_URL=https://evo.gradehorarios.com.br
#   EVOLUTION_API_KEY=<sua-chave>
#   SMTP_HOST=<host>
#   SMTP_PORT=587
#   SMTP_USER=<usuario>
#   SMTP_PASSWORD=<senha>
#   JWT_SECRET=<chave com >= 32 caracteres (HS256)>
#   APP_ENCRYPTION_MASTER_KEY=<chave-mestre para criptografia em repouso>
#   APP_BACKEND_URL=<URL pública do backend, p/ webhook da Evolution API>
#   FRONTEND_URL=http://localhost:3000
#
# Observação: se EVOLUTION_API_URL ficar vazio, o MOCK do WhatsApp fica ativo
# (útil para testar o fluxo de QR code sem Evolution real).

services:
  postgres:
    image: postgres:16-alpine
    container_name: mana-paes-postgres
    environment:
      POSTGRES_DB: manapaes
      POSTGRES_USER: manapaes
      POSTGRES_PASSWORD: manapaes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manapaes -d manapaes"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: mana-paes-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: manapaes
      RABBITMQ_DEFAULT_PASS: manapaes
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  api:
    build:
      context: ./mana-paes-api
      dockerfile: local.Dockerfile
    container_name: mana-paes-api
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: manapaes
      DB_USER: manapaes
      DB_PASSWORD: manapaes
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      RABBIT_USER: manapaes
      RABBIT_PASSWORD: manapaes
      # SMTP externo — via variáveis de ambiente
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-true}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      # Evolution API externa — via variáveis de ambiente
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      APP_BACKEND_URL: ${APP_BACKEND_URL:-}
      # Segredos — obrigatórios em produção
      JWT_SECRET: ${JWT_SECRET:-}
      APP_ENCRYPTION_MASTER_KEY: ${APP_ENCRYPTION_MASTER_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  web:
    build:
      context: ./mana-paes-web
      dockerfile: Dockerfile
    container_name: mana-paes-web
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  rabbitmqdata: