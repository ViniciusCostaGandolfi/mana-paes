# Stack de DESENVOLVIMENTO LOCAL — Mana Paes (tudo mockado)
#
# Infraestrutura + API em modo JVM (sem GraalVM Native Image).
# O build nativo é reservado para a nuvem (ver Dockerfile.cloud / CI).
#
# Tudo que depende de provedores externos está MOCKADO:
#   - Evolution API (WhatsApp) -> MOCK no backend (EVOLUTION_API_URL vazio)
#   - SMTP (e-mail)            -> Mailpit (captura local, UI em http://localhost:8025)
#   - RabbitMQ                 -> contêiner local (fila real, porém isolada)
#
# Uso:
#   docker compose -f docker-compose.dev.yaml up -d --build
#   docker compose -f docker-compose.dev.yaml logs -f api
#
# Serviços:
#   postgres  -> banco de dados (porta 5432)
#   rabbitmq  -> fila de notificações + management UI (porta 15672)
#   mailpit   -> captura de e-mails em dev (UI na porta 8025, SMTP na 1025)
#   api       -> backend Spring Boot em JVM (porta 8080)
#   web       -> frontend (comentado: gerenciado pelo agente de frontend)

services:
  postgres:
    image: postgres:16-alpine
    container_name: mana-paes-postgres
    environment:
      POSTGRES_DB: manapaes
      POSTGRES_USER: manapaes
      POSTGRES_PASSWORD: manapaes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manapaes -d manapaes"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: mana-paes-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: manapaes
      RABBITMQ_DEFAULT_PASS: manapaes
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1
    container_name: mana-paes-mailpit
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # UI
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./mana-paes-api
      dockerfile: local.Dockerfile
    container_name: mana-paes-api
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: manapaes
      DB_USER: manapaes
      DB_PASSWORD: manapaes
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      RABBIT_USER: manapaes
      RABBIT_PASSWORD: manapaes
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_ENABLED: "true"
      NOTIFICATIONS_ENABLED: "true"
      SCHEDULER_ENABLED: "true"
      JWT_SECRET: mana-paes-dev-secret-change-me-0123456789
      APP_ENCRYPTION_MASTER_KEY: mana-paes-dev-master-key-32chars!
      # Evolution API vazia => MOCK do WhatsApp ativo (sem chamadas externas)
      EVOLUTION_API_URL: ""
      EVOLUTION_API_KEY: ""
      APP_BACKEND_URL: ""
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  web:
    build:
      context: ./mana-paes-web
      dockerfile: Dockerfile
    container_name: mana-paes-web
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  rabbitmqdata: