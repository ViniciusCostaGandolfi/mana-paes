# ==============================================================================
# Mana Paes — docker-compose de PRODUÇÃO/NUVEM (deploy no Coolify)
# ------------------------------------------------------------------------------
# Stack completa: PostgreSQL + RabbitMQ + API (build nativo GraalVM) + Web.
#
# TODAS as variáveis são lidas do arquivo `.env` na RAIZ do repositório —
# SEM fallback: se a variável não estiver definida no .env, o compose falha
# na interpolação (evita deploy com valor vazio/errado).
#
# Uso:
#   cp example.env .env   # e preencha TODOS os valores
#   docker compose up -d --build
#
# Obrigatórias (sem default; interpolação falha se ausentes):
#   DB_PASSWORD, RABBIT_USER, RABBIT_PASSWORD, JWT_SECRET,
#   APP_ENCRYPTION_MASTER_KEY
# Demais: DB_HOST/PORT/NAME/USER, SMTP_*, MAIL_ENABLED, EVOLUTION_API_URL/KEY,
#   APP_BACKEND_URL, FRONTEND_URL, NOTIFICATIONS_ENABLED, SCHEDULER_ENABLED,
#   VITE_API_URL (build do web)
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  api:
    build:
      context: ./mana-paes-api
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_ENABLED: ${MAIL_ENABLED}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED}
      # Secrets obrigatorios: sem valor no .env => interpolação falha
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET e obrigatorio no .env}
      APP_ENCRYPTION_MASTER_KEY: ${APP_ENCRYPTION_MASTER_KEY:?APP_ENCRYPTION_MASTER_KEY e obrigatorio no .env}
      # Evolution vazio => MOCK (sem WhatsApp real). Em producao, preencher.
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      APP_BACKEND_URL: ${APP_BACKEND_URL}
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  web:
    build:
      context: ./mana-paes-web
      dockerfile: Dockerfile
      args:
        # URL da API embutida no bundle do frontend (sem proxy do Vite em prod)
        VITE_API_URL: ${VITE_API_URL}
    depends_on:
      - api

volumes:
  pgdata:
  rabbitmqdata: